name: Flutter CI

on:
  pull_request:
    paths:
      - "flutter-app/**"
      - ".github/workflows/flutter-ci.yml"

  push:
    branches:
      - main
      - "chore/**"
      - "feat/**"
    paths:
      - "flutter-app/**"
      - ".github/workflows/flutter-ci.yml"

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    env:
      TZ: Europe/Berlin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: flutter-app/pubspec.yaml
          channel: stable
          cache: true

      - name: Flutter version
        working-directory: flutter-app
        run: flutter --version

      - name: Get dependencies
        working-directory: flutter-app
        run: flutter pub get

      - name: Analyze
        working-directory: flutter-app
        run: flutter analyze

      - name: Test
        working-directory: flutter-app
        run: flutter test

      - name: Build APK
        working-directory: flutter-app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: besser-bahn-release-apk
          path: flutter-app/build/app/outputs/flutter-apk/app-release.apk

  distribute-firebase:
    if: github.event_name == 'push'
    needs: analyze-and-test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: besser-bahn-release-apk
          path: apk

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: besser-bahn
          workload_identity_provider: "projects/658602031061/locations/global/workloadIdentityPools/github-actions/providers/github-actions"
          service_account: "github-actions-firebase@besser-bahn.iam.gserviceaccount.com"
          token_format: access_token
          access_token_scopes: "https://www.googleapis.com/auth/cloud-platform"

      - name: Test Firebase API authentication
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail

          echo "Testing Firebase App Distribution API authentication..."

          RESPONSE=$(curl --silent --show-error \
            --request GET \
            "https://firebaseappdistribution.googleapis.com/v1/projects/658602031061/apps/1:658602031061:android:f884fca4cf5d4b0ad6ef5c" \
            --header "Authorization: Bearer ${ACCESS_TOKEN}" \
            --write-out "\nHTTP_STATUS:%{http_code}")

          echo "$RESPONSE"