name: Flutter CI

on:
  pull_request:
    paths:
      - "flutter-app/**"
      - ".github/workflows/flutter-ci.yml"

  push:
    branches:
      - main
      - "chore/**"
      - "feat/**"
    paths:
      - "flutter-app/**"
      - ".github/workflows/flutter-ci.yml"

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    env:
      TZ: Europe/Berlin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: flutter-app/pubspec.yaml
          channel: stable
          cache: true

      - name: Flutter version
        working-directory: flutter-app
        run: flutter --version

      - name: Get dependencies
        working-directory: flutter-app
        run: flutter pub get

      - name: Analyze
        working-directory: flutter-app
        run: flutter analyze

      - name: Test
        working-directory: flutter-app
        run: flutter test

      - name: Build APK
        working-directory: flutter-app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: besser-bahn-release-apk
          path: flutter-app/build/app/outputs/flutter-apk/app-release.apk

  distribute-firebase:
    if: github.event_name == 'push'
    needs: analyze-and-test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: besser-bahn-release-apk
          path: apk

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: besser-bahn
          workload_identity_provider: "projects/658602031061/locations/global/workloadIdentityPools/github-actions/providers/github-actions"
          service_account: "github-actions-firebase@besser-bahn.iam.gserviceaccount.com"
          token_format: access_token
          access_token_scopes: "https://www.googleapis.com/auth/cloud-platform"

      - name: Upload APK to Firebase App Distribution
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail

          APK="apk/app-release.apk"
          UPLOAD_URL="https://firebaseappdistribution.googleapis.com/upload/v1/projects/658602031061/apps/1:658602031061:android:5919c880474b2e10d6ef5c/releases:upload"

          echo "Uploading APK to Firebase App Distribution..."

          RESPONSE=$(curl --silent --show-error --fail-with-body \
            --request POST \
            "${UPLOAD_URL}" \
            --header "Authorization: Bearer ${ACCESS_TOKEN}" \
            --header "X-Goog-Upload-Protocol: raw" \
            --header "X-Goog-Upload-File-Name: app-release.apk" \
            --header "Content-Type: application/octet-stream" \
            --data-binary "@${APK}")

          echo "Upload response:"
          echo "$RESPONSE"

          OPERATION_NAME=$(echo "$RESPONSE" | jq -r '.name // empty')

          if [ -z "$OPERATION_NAME" ]; then
            echo "ERROR: Firebase did not return an operation name."
            exit 1
          fi

          echo "Firebase operation:"
          echo "$OPERATION_NAME"

          for i in {1..30}; do
            echo "Checking Firebase upload status ($i/30)..."

            OPERATION=$(curl --silent --show-error --fail-with-body \
              --request GET \
              "https://firebaseappdistribution.googleapis.com/v1/${OPERATION_NAME}" \
              --header "Authorization: Bearer ${ACCESS_TOKEN}")

            DONE=$(echo "$OPERATION" | jq -r '.done // false')

            if [ "$DONE" = "true" ]; then
              ERROR=$(echo "$OPERATION" | jq -r '.error.message // empty')

              if [ -n "$ERROR" ]; then
                echo "ERROR: Firebase upload failed:"
                echo "$ERROR"
                exit 1
              fi

              RELEASE_NAME=$(echo "$OPERATION" | jq -r '.response.release.name // empty')

              if [ -z "$RELEASE_NAME" ]; then
                echo "ERROR: Upload completed but no release was returned."
                echo "Full response:"
                echo "$OPERATION"
                exit 1
              fi

              echo "SUCCESS: Firebase release created."
              echo "Release: $RELEASE_NAME"

              RELEASE_URI=$(echo "$OPERATION" | jq -r '.response.release.firebaseConsoleUri // empty')

              if [ -n "$RELEASE_URI" ]; then
                echo "Firebase Console:"
                echo "$RELEASE_URI"
              fi

              exit 0
            fi

            sleep 5
          done

          echo "ERROR: Firebase upload did not complete within 150 seconds."
          exit 1